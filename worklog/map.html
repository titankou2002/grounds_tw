<style>
:root{--fg:#111;--muted:#6b7280;--line:#e5e7eb;--bg:#f6f6f4;--zoom:1.1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Noto Sans TC","Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:8px;background:#111;color:#fff;font:bold 21px Georgia,serif;display:flex;align-items:center;justify-content:center;padding-bottom:3px}
.ttl{font-weight:800;font-size:15px;flex:1}
.lock{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}.lock.on{background:#dcfce7;border-color:#86efac;color:#166534}
.lang{display:flex;background:#f1f1f4;border-radius:18px;padding:2px}
.lang button{border:0;background:transparent;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.lang button.on{background:#111;color:#fff}
.wrap{max-width:1360px;margin:0 auto;padding:12px 12px calc(16px + env(safe-area-inset-bottom))}
.sort{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.chip.on{background:#111;color:#fff;border-color:#111}
.layout{display:grid;grid-template-columns:minmax(0,520px) 1fr;gap:14px;align-items:start}
#map{height:calc(100vh - 140px);min-height:360px;border-radius:12px;border:1px solid var(--line);position:sticky;top:76px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.card.focus{box-shadow:0 0 0 2px #2563eb}
.row{display:flex;gap:10px;align-items:flex-start}
.thumb{width:84px;height:64px;border-radius:8px;object-fit:cover;background:#eee;flex:0 0 auto}
.info{flex:1;min-width:0}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;margin-bottom:4px}
.title{font-size:14px;font-weight:800;line-height:1.35;margin:0 0 3px}
.addr{font-size:11.5px;color:var(--muted);margin-bottom:5px}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid;font-weight:700;white-space:nowrap}
.p-warn{background:#fee2e2;color:#b91c1c;border-color:#fca5a5}.p-rent{background:#fee2e2;color:#991b1b;border-color:#fca5a5}.p-ok{background:#dcfce7;color:#166534;border-color:#86efac}.p-mid{background:#fef3c7;color:#92400e;border-color:#fde68a}
.p-area{background:#ccfbf1;color:#115e59;border-color:#99f6e4}.p-unit{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
.more{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;line-height:1.6}
.card.open .more{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-bottom:8px}
.strip{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}
.strip img{height:64px;border-radius:6px;cursor:zoom-in}
.neg{color:#b91c1c}
.src{display:inline-block;margin-top:6px;color:#2563eb;font-weight:700;text-decoration:none}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:3000;align-items:center;justify-content:center;padding:16px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:8px}
#lb button{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:18px}
.edit{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.edit h4{margin:0 0 6px;font-size:12.5px;color:var(--muted)}
.strip .ph{position:relative;flex:0 0 auto}
.strip .ph i.star{position:absolute;top:-4px;left:-4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-style:normal;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}.strip .ph i.star.on{background:#f59e0b}
.strip .ph b{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:#b91c1c;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.strip .mv{display:flex;justify-content:space-between;margin-top:2px}
.strip .mv button{width:22px;height:18px;border:1px solid var(--line);background:#fff;border-radius:4px;padding:0;font-weight:700;cursor:pointer;line-height:16px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
.btn.pri{background:#111;color:#fff;border-color:#111}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:7px 9px;margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
.an-text{font-size:12.5px;line-height:1.55;word-break:break-word;display:inline-block;width:100%}
.an-h{font-weight:800;margin:6px 0 2px;line-height:1.4}.an-h:first-child{margin-top:0}
.an-li{display:flex;gap:6px;align-items:flex-start;margin:2px 0;line-height:1.5}
.an-b{flex:0 0 auto;font-weight:700}.an-li-t{flex:1;min-width:0}.an-p{margin:2px 0}.an-sp{height:6px}
.note small{display:block;color:var(--muted);margin-top:3px}.note small a{color:#b91c1c;cursor:pointer;margin-left:8px}
.edit textarea,.edit input[type=text],.edit input[type=number],.edit select{width:100%;font:inherit;font-size:16px;padding:7px 9px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
.edit label{display:block;font-size:12px;color:var(--muted);margin:6px 0 2px}
.edit .two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.edit .ck{display:flex;align-items:center;gap:6px;color:var(--fg);font-size:13px}.edit .ck input{width:auto}
.empty{text-align:center;color:var(--muted);padding:40px 0}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  #map{position:relative;top:auto;height:300px;min-height:0;order:-1}
  .title{font-size:16px}.addr{font-size:13px}.pill{font-size:12.5px;padding:3px 8px}.tag{font-size:12px}
  .chip{font-size:14px;padding:8px 14px}.lang button{font-size:14px}.more{font-size:14px}.thumb{width:92px;height:70px}
}
</style>

      if (!Object.keys(fields).length) { delete editing[id]; rerender(id); return; }
      api({ action: 'edit', id: id, fields: fields }).then(function () {
        Object.keys(fields).forEach(function (k) { var v = fields[k]; s[k] = (['rent', 'area', 'deposit'].indexOf(k) >= 0) ? Number(v) : v; });
        delete s.titleJa; delete s.prosJa; delete s.consJa; s.unverified = false; delete editing[id]; rerender(id); toast(t.saved);
      }).catch(function () { toast(t.fail); });
    }
    else if (act === 'nadd') {
      var ta = box.querySelector('[data-note]'), text = ta.value.trim(); if (!text) return;
      api({ action: 'note_add', id: id, text: text }).then(function () { return fetch('api_edit.php', { cache: 'no-store' }).then(function (r) { return r.json(); }); })
        .then(function (d) { notes = d.notes || {}; rerender(id); toast(t.saved); }).catch(function () { toast(t.fail); });
    }
    else if (act === 'ndel') {
      if (!confirm(t.delNote)) return;
      api({ action: 'note_del', id: id, noteId: el.dataset.n }).then(function () { notes[id] = (notes[id] || []).filter(function (n) { return n.id !== el.dataset.n; }); rerender(id); }).catch(function () { toast(t.fail); });
    }
    else if (act === 'cover') {
      var cu = el.dataset.u, isOn = s.coverImg === cu;
      api({ action: 'edit', id: id, fields: { coverImg: isOn ? '' : cu } }).then(function () { if (isOn) delete s.coverImg; else s.coverImg = cu; rerender(id); toast(isOn ? t.coverOff : t.coverOn); }).catch(function () { toast(t.fail); });
    }
    else if (act === 'pdel') {
      if (!confirm(t.delPh)) return;
      var u = el.dataset.u;
      api({ action: 'img_del', id: id, url: u }).then(function () {
        s.images = (s.images || []).filter(function (x) { return x !== u; });
        if (s.coverImg === u) {
          s.coverImg = s.images[0] || '';
          return api({ action: 'edit', id: id, fields: { coverImg: s.coverImg } });
        }
      }).then(function () { rerender(id); }).catch(function () { toast(t.fail); });
    }
    else if (act === 'pleft' || act === 'pright') {
      var imgs = (s.images || []).slice(), i = imgs.indexOf(el.dataset.u), j = i + (act === 'pleft' ? -1 : 1);
      if (i < 0 || j < 0 || j >= imgs.length) return;
      var tmp = imgs[i]; imgs[i] = imgs[j]; imgs[j] = tmp;
      api({ action: 'img_set', id: id, images: imgs }).then(function () { s.images = imgs; rerender(id); }).catch(function () { toast(t.fail); });
    }
  }
  function onPhoto(e) {
    var inp = e.target; if (!inp.matches('[data-photo]')) return;
    var id = inp.closest('.card').dataset.id, s = byId(id), files = Array.prototype.slice.call(inp.files), t = T();
    toast('…');
    files.reduce(function (p, f) {
      return p.then(function () { return shrink(f); }).then(function (b) { var fd = new FormData(); fd.append('action', 'img_add'); fd.append('id', id); fd.append('photo', b, 'p.jpg'); return api(fd); })
        .then(function (d) { (s.images = s.images || []).push(d.url); });
    }, Promise.resolve()).then(function () { rerender(id); toast(t.saved); }).catch(function () { rerender(id); toast(t.fail); });
  }
  function updateLock() { var b = $('lock'); b.className = 'lock' + (canEdit ? ' on' : ''); b.textContent = canEdit ? T().lockOn : T().lockIn; }
  function loadAuth() {
    return fetch('api_edit.php', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : { success: false }; }).catch(function () { return { success: false }; })
      .then(function (d) { canEdit = !!d.success; notes = d.notes || {}; updateLock(); });
  }
  $('lock').onclick = function () {
    if (canEdit) return;
    var pw = prompt(T().pw); if (!pw) return;
    var fd = new FormData(); fd.append('wl_pw', pw);
    fetch('./', { method: 'POST', body: fd, credentials: 'same-origin' }).then(loadAuth).then(function () { if (!canEdit) toast(T().pwBad); else rerender(); });
  };

  function sorted() {
    var a = stores.slice(), u = function (s) { return (s.rent || 0) / (s.area || 1); };
    if (sort === 'area') a.sort(function (x, y) { return (y.area || 0) - (x.area || 0); });
    else if (sort === 'rent') a.sort(function (x, y) { return (x.rent || 0) - (y.rent || 0); });
    else if (sort === 'unit') a.sort(function (x, y) { return u(x) - u(y); });
    return a;
  }
  function renderSort() {
    $('sort').innerHTML = T().sorts.map(function (s) { return '<button class="chip' + (sort === s[0] ? ' on' : '') + '" data-s="' + s[0] + '">' + s[1] + '</button>'; }).join('');
    Array.prototype.forEach.call($('sort').children, function (b) { b.onclick = function () { sort = (sort === b.dataset.s) ? 'default' : b.dataset.s; renderSort(); renderList(); }; });
  }
  function renderList() {
    var t = T(), list = $('list');
    if (!stores.length) { list.innerHTML = '<div class="empty">' + t.none + '</div>'; return; }
    list.innerHTML = sorted().map(function (s) {
      var nn = s.rent > 0 && s.area > 0, rw = Math.round(s.rent / 100) / 100, ar = Math.round(s.area * 100) / 100, un = nn ? Math.round(s.rent / s.area) : 0;
      var imgs = s.images || [], cover = (s.coverImg && imgs.indexOf(s.coverImg) >= 0) ? s.coverImg : (imgs[0] || ''), img = cover;
      return '<div class="card" id="c-' + esc(s.id) + '" data-id="' + esc(s.id) + '"><div class="row">' +
        (img ? '<img class="thumb" src="' + esc(img) + '" alt="">' : '<div class="thumb"></div>') +
        '<div class="info"><span class="tag">' + esc(status(s)) + '</span><div class="title">' + esc(title(s)) + '</div><div class="addr">' + esc(s.address) + '</div>' +
        '<div class="pills">' + (s.unverified ? '<span class="pill p-warn">⚠ ' + (lang === 'ja' ? '数値要確認' : '數字待確認') + '</span>' : '') + (nn ? '<span class="pill p-rent ' + rentCls(s.rent) + '">' + t.rent + ' NT$ ' + rw + t.wan + '（' + jw(s.rent) + '）</span><span class="pill p-area">' + ar + ' 坪 (' + Math.round(ar * 3.3058) + '㎡)</span>' +
        '<span class="pill p-unit">' + t.unit + ' ' + un.toLocaleString() + '/坪（' + jy(un) + '）</span>' : '') + '</div></div></div>' +
        '<div class="more">' +
        (imgs.length > 1 || (canEdit && imgs.length) ? '<div class="strip">' + imgs.map(function (u) { return '<div class="ph"><img src="' + esc(u) + '" data-big="' + esc(u) + '" alt="">' + (canEdit ? '<b data-act="pdel" data-u="' + esc(u) + '">×</b><i data-act="cover" data-u="' + esc(u) + '" class="star' + (u === cover ? ' on' : '') + '">' + (u === cover ? '★' : '☆') + '</i><span class="mv"><button type="button" data-act="pleft" data-u="' + esc(u) + '" title="' + esc(t.left) + '">‹</button><button type="button" data-act="pright" data-u="' + esc(u) + '" title="' + esc(t.right) + '">›</button></span>' : '') + '</div>'; }).join('') + '</div>' : '') +
        '<div class="grid">' + (nn ? '<div>' + t.rentL + '：<b>NT$ ' + rw + t.wan + '</b><br>' + jw(s.rent) + '/月</div><div>' + t.areaL + '：<b>' + ar + ' 坪</b><br>' + Math.round(ar * 3.3058) + '㎡</div><div>' + t.unitL + '：<b>NT$ ' + un.toLocaleString() + '</b><br>' + jy(un) + '</div>' : '') +
        '<div>' + t.depL + '：<b>' + esc(depLabel(s)) + '</b>' + (Number(s.deposit) > 0 ? '<br>' + jw(s.deposit) : '') + '</div><div>' + t.freeL + '：<b>' + esc(months(s.freeRent || '洽詢')) + '</b></div><div>' + t.regL + '：<b>' + tri(s.canRegister, t.yes, t.no) + '</b></div><div>' + t.invL + '：<b>' + tri(s.canInvoice, t.yes, t.no) + '</b></div></div>' +
        (s.pros ? '<div><b>' + t.pros + '：</b>' + formatAnalysisHtml(tx(s.pros, s.prosJa)) + '</div>' : '') +
        (s.cons ? '<div class="neg"><b>' + t.cons + '：</b>' + formatAnalysisHtml(tx(s.cons, s.consJa)) + '</div>' : '') +
        (/^https?:/i.test(s.url || '') ? '<a class="src" href="' + esc(s.url) + '" target="_blank" rel="noopener">🔗 ' + t.src + '</a>' : '') +
        (canEdit ? editBlock(s) : '') + '</div></div>';
    }).join('');
    list.onchange = onPhoto;
    Array.prototype.forEach.call(list.querySelectorAll('.card'), function (c) {
      c.onclick = function (e) {
        if (e.target.closest('a,.edit')) { if (e.target.closest('.edit')) onEditClick(e); return; }
        if (e.target.closest('[data-act]')) { onEditClick(e); return; }
        if (e.target.dataset && e.target.dataset.big) { $('lb').querySelector('img').src = e.target.dataset.big; $('lb').classList.add('on'); return; }
        c.classList.toggle('open');
        if (!mobile()) focusStore(c.dataset.id);   // 手機：只展開／收合，不動地圖
      };
    });
  }
  function focusStore(id) {
    var s = stores.filter(function (x) { return x.id === id; })[0];
    Array.prototype.forEach.call(document.querySelectorAll('.card.focus'), function (c) { c.classList.remove('focus'); });
    var c = $('c-' + id); if (c) c.classList.add('focus');
    if (s && map && markers[id]) { map.setView([s.lat, s.lng], 16); markers[id].openPopup(); }
  }
  function renderMap(keep) {
    if (!window.L) return;
    if (!map) { map = L.map('map').setView([25.056, 121.5218], 14); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map); }
    Object.keys(markers).forEach(function (k) { map.removeLayer(markers[k]); }); markers = {};
    var t = T(), pts = [];
    stores.forEach(function (s) {
      if (typeof s.lat !== 'number' || typeof s.lng !== 'number') return;
      var m = L.marker([s.lat, s.lng]).addTo(map);
      m.bindPopup('<b>' + esc(title(s)) + '</b><br>' + t.rent + ' NT$ ' + (Math.round(s.rent / 100) / 100) + t.wan + '（' + jw(s.rent) + '）<br>' + (Math.round(s.area * 100) / 100) + '坪');
      m.on('click', function () { if (!mobile()) { var c = $('c-' + s.id); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); } } });
      markers[s.id] = m; pts.push([s.lat, s.lng]);
    });
    if (pts.length && !keep) map.fitBounds(pts, { padding: [30, 30], maxZoom: 15 });
    setTimeout(function () { map.invalidateSize(); }, 200);
  }
  function setLang(l) {
    lang = l; document.documentElement.lang = l === 'ja' ? 'ja' : 'zh-TW';
    $('l-zh').classList.toggle('on', l === 'zh'); $('l-ja').classList.toggle('on', l === 'ja');
    try { localStorage.setItem('gtw_map_lang', l); } catch (e) {}
    updateLock(); renderSort(); renderList(); renderMap();
  }
  $('l-zh').onclick = function () { setLang('zh'); }; $('l-ja').onclick = function () { setLang('ja'); };
    var _lbPtrDown = null;
  document.addEventListener('pointerdown', function (e) { _lbPtrDown = e.target; }, true);
  $('lb').onclick = function (e) {
    if (_lbPtrDown !== $('lb')) return; // 在圖片上按下再拖出不關；必須按下就在背景
    if (e.target !== $('lb')) return;   // 點到圖片或按鈕不走這條（按鈕自己關）
    try {
      var sel = window.getSelection && window.getSelection();
      if (sel && !sel.isCollapsed && String(sel).length > 0) return;
    } catch (err) {}
    $('lb').classList.remove('on');
  };
  // 編輯中若點卡片外，不要默默丟掉（以前沒有這行為；補 Esc 保護）
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if ($('lb').classList.contains('on')) { $('lb').classList.remove('on'); return; }
    var ids = Object.keys(editing);
    if (!ids.length) return;
    if (!window.confirm(lang === 'ja' ? '編集が未保存です。破棄しますか？' : '編輯尚未儲存，確定放棄？')) return;
    ids.forEach(function (id) { delete editing[id]; });
    rerender();
  });
  function dropData(s) {
    s.images = (s.images || []).filter(function (u) { return typeof u === 'string' && u.indexOf('data:') !== 0 && !/^javascript:/i.test(u); });
    if (typeof s.coverImg === 'string' && (s.coverImg.indexOf('data:') === 0 || /^javascript:/i.test(s.coverImg))) delete s.coverImg;
    if (typeof s.url === 'string' && /^javascript:/i.test(s.url)) delete s.url;
    return s;
  }
  fetch('api_stores.php', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) { stores = (d.stores || []).map(dropData); return loadAuth(); }).then(function () { setLang(lang); }).catch(function () { setLang(lang); });
})();
</script>
